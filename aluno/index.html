<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Poppins:wght@300;400;500;600&family=Nunito:wght@400;600;700&family=Caveat:wght@500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>

<style>
/* Layout: painel da professora com abas (Agenda, Alunos, Financeiro, Atividades, Correções, Ajustes); perfis e ações abrem em páginas internas e painéis laterais */
:root{
  --bg:#FAF6F2; --panel:#FFFFFF; --ink:#3F3633; --muted:#8C7F7A; --line:#EADFD8; --field:#FFFDFB;
  --accent:#B88378; --accent-ink:#FFFFFF; --soft:#F3E2DA; --gold:#CFA22B; --gold-soft:#F9EAB8;
  --ok:#4F8462; --ok-bg:#E4EFE7; --warn:#A8721F; --warn-bg:#F7EAD3; --bad:#B4554B; --bad-bg:#F6E1DE; --info:#5F7E98; --info-bg:#E3EBF2;
  --on-accent:#FFFFFF; --lvl-bg:#3F3633; --lvl-ink:#FFFFFF; --priv-bg:#FFF8E8; --priv-line:#E5C77F; --priv-ink:#A8721F;
  --ev-ink:#7A4E45; --extra-ink:#7A5B0E; --cancel-bg:#EEEEEE; --cancel-ink:#8A8482; --free-bg:#F6FBF7; --free-line:#BFD6C5; --overlay:rgba(40,30,28,.35);
  --deco-a:#F1DCD3; --deco-b:#F3E2DA; --deco-ring:rgba(184,131,120,.35); --duo:#2F4F6E; --duo-bg:#E3EBF2;
  --serif:"Playfair Display", Georgia, serif; --sans:"Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
:root[data-mode="dark"]{
  --bg:#1E1A19; --panel:#282321; --ink:#F2EAE6; --muted:#ADA19C; --line:#3D3532; --field:#231F1D;
  --accent:#D29C90; --accent-ink:#2A1F1C; --soft:#4A3530; --gold:#E0B84A; --gold-soft:#4A3F1F;
  --ok:#8FC4A0; --ok-bg:#22382B; --warn:#E2B867; --warn-bg:#3E3220; --bad:#E39088; --bad-bg:#44282A; --info:#9FBCD6; --info-bg:#26323D;
  --on-accent:#2A1F1C; --lvl-bg:#F2EAE6; --lvl-ink:#2A2321; --priv-bg:#352D20; --priv-line:#7A6533; --priv-ink:#E2B867;
  --ev-ink:#F0CFC6; --extra-ink:#F1D58A; --cancel-bg:#3A3533; --cancel-ink:#A39A97; --free-bg:#1F2C25; --free-line:#3F5E4B; --overlay:rgba(0,0,0,.55);
  --deco-a:#3A2A26; --deco-b:#332724; --deco-ring:rgba(210,156,144,.28); --duo:#B9D2EA; --duo-bg:#26323D;
  color-scheme:dark;
}
.bgdeco{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.bgdeco i{position:absolute;border-radius:50%;display:block}
.bgdeco .g{right:-180px;bottom:-200px;width:760px;height:760px;background:radial-gradient(circle,var(--deco-a) 0%,transparent 68%)}
.bgdeco .c{right:-120px;bottom:-120px;width:460px;height:460px;background:var(--deco-b)}
.bgdeco .r{right:40px;bottom:60px;width:560px;height:560px;border:1.5px solid var(--deco-ring)}
.bgdeco .l{right:120px;top:90px;width:220px;height:0;border-top:1.5px solid var(--deco-ring);border-radius:0}
@media (max-width:720px){.bgdeco .g{width:420px;height:420px}.bgdeco .c{width:260px;height:260px}.bgdeco .r{width:320px;height:320px;right:-40px}.bgdeco .l{display:none}}
.toggles{display:inline-flex;gap:6px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.seg button{border:none;background:none;padding:5px 11px;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
[hidden]{display:none!important}
.wrap{max-width:1160px;margin:0 auto;padding-top:22px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(26px,4.6vw,36px)} h2{font-size:22px} h3{font-size:17px}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
.muted{color:var(--muted)} .small{font-size:12px} .hint{font-size:11.5px;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0} .stack.tight{gap:8px}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:560px){.row,.row3{grid-template-columns:minmax(0,1fr)}}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:920px){.cols{grid-template-columns:minmax(0,1fr)}}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:90px;line-height:1.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer}
.btn{font-size:13.5px;font-weight:500;border-radius:10px;padding:9px 15px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn:disabled{opacity:.55;cursor:default}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.link{background:none;border:none;color:var(--accent);padding:2px 4px;font-size:12.5px}
.link.danger{color:var(--bad)}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:10px 14px;color:var(--muted);font-size:14px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:500;background:var(--soft);color:var(--ink);white-space:nowrap}
.badge.lvl{background:var(--lvl-bg);color:var(--lvl-ink);letter-spacing:.04em}
.badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.warn{background:var(--warn-bg);color:var(--warn)} .badge.bad{background:var(--bad-bg);color:var(--bad)} .badge.info{background:var(--info-bg);color:var(--info)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.scard{display:flex;gap:12px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;color:inherit;width:100%}
.scard:hover{border-color:var(--accent)}
.lvlhead{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.avatar{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--soft);color:var(--accent);font-family:var(--serif);font-size:18px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.lg{width:80px;height:80px;font-size:30px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel)}
.panel .item{background:var(--field)}
.item .t{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis}
.item .acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center}
.score{font-family:var(--serif);font-size:18px;font-variant-numeric:lining-nums tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel)}
.kpi .k{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--serif);font-size:22px;font-variant-numeric:lining-nums tabular-nums}
.kpi .v.ok{color:var(--ok)} .kpi .v.warn{color:var(--warn)}
.private{background:var(--priv-bg);border:1px dashed var(--priv-line);border-radius:12px;padding:14px}
.private .eyebrow{color:var(--priv-ink)}
.entry{border-left:2px solid var(--soft);padding:4px 0 4px 14px}
.entry .d{font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.empty{color:var(--muted);font-size:13px;padding:16px;border:1px dashed var(--line);border-radius:12px;text-align:center}
.status{min-height:18px;font-size:12.5px;color:var(--muted);margin:0}
pre.fmt{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12px;white-space:pre-wrap;margin:0;overflow-x:auto}
fieldset.group{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0;display:flex;flex-direction:column;gap:12px;min-width:0}
fieldset.group legend{font-family:var(--serif);font-size:15px;padding:0 6px;color:var(--ink)}
@media (max-width:560px){.item{grid-template-columns:minmax(0,1fr)}.item .acts{justify-content:flex-start}}

/* calendário do aluno */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0}
.cal .day{min-height:58px;border:1px solid var(--line);border-radius:9px;padding:5px 6px;background:var(--panel);text-align:left;display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink)}
.cal .day.out{visibility:hidden}
.cal .day.today{border-color:var(--ink)}
.cal .day .n{font-variant-numeric:tabular-nums;color:var(--muted)}
.cal .ev{border-radius:5px;padding:1px 5px;font-size:10.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.normal{background:var(--soft);color:var(--ev-ink)}
.ev.falta{background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
.ev.cancelada{background:var(--cancel-bg);color:var(--cancel-ink);text-decoration:line-through}
.ev.reposicao{background:var(--info-bg);color:var(--info)}
.ev.extra{background:var(--gold-soft);color:var(--extra-ink)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* agenda semanal */
.week{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px;overflow-x:auto;padding-bottom:4px}
.wcol{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.wcol.today{border-color:var(--ink)}
.wcol h4{margin:0;font-family:var(--serif);font-weight:500;font-size:15px}
.wcol .date{font-size:11px;color:var(--muted)}
.slot{border-radius:9px;padding:6px 8px;font-size:12px;text-align:left;border:1px solid transparent;width:100%;color:var(--ink)}
.slot b{font-weight:600;font-variant-numeric:tabular-nums}
.slot.normal{background:var(--soft)} .slot.reposicao{background:var(--info-bg)} .slot.pend{background:var(--warn-bg);outline:2px dashed var(--warn);outline-offset:-2px} .slot.extra{background:var(--gold-soft)}
.slot.isduo{box-shadow:none;outline:3px dotted var(--duo);outline-offset:-3px} /* dupla: mantém a cor da aula (rosa) ou da reposição (azul), só ganha a borda pontilhada */
.slot.falta{background:var(--bad-bg);text-decoration:line-through;color:var(--bad)} .slot.cancelada{background:var(--cancel-bg);color:var(--cancel-ink);text-decoration:line-through}
.free{font-size:11px;color:var(--ok);border:1px dashed var(--free-line);border-radius:8px;padding:4px 7px;background:var(--free-bg)}
@media (max-width:720px){.week{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.cal .day{min-height:46px;padding:4px}.cal .ev{font-size:0;height:7px;padding:0;border-radius:4px}}

/* editor de atividades: caixas que crescem, lacunas por toque */
.edcols{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.edcols>.side{position:sticky;top:12px}
@media (max-width:920px){.edcols{grid-template-columns:minmax(0,1fr)}.edcols>.side{position:static}}
textarea.grow{min-height:46px;overflow:hidden;resize:vertical}
textarea.grow.big{min-height:120px}
.q.err{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad-bg)}
.gappick{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;line-height:2.3;font-size:15px;white-space:pre-wrap;background:var(--field)}
.gappick .gw{border:0;background:none;padding:2px 1px;margin:0;border-radius:6px;font:inherit;color:var(--ink);cursor:pointer}
.gappick .gw:hover{background:var(--soft)}
.gappick .gw.on{background:var(--ok-bg);color:var(--ok);font-weight:500;outline:1px solid var(--ok);padding:2px 8px}
.gapans{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.gapline .gin{display:inline-block;width:auto;min-width:70px;padding:3px 8px;margin:0 3px}
.gapline select.gin{max-width:min(240px,70vw);padding:3px 6px;font-size:14px}
.dropzone{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:2px dashed var(--line);border-radius:14px;padding:26px 16px;cursor:pointer;background:var(--field);transition:background .15s,border-color .15s}
.dropzone:hover,.dropzone.on{border-color:var(--accent);background:var(--soft)}
.bankbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:4px 14px;background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13.5px}
.gapline .right-w{color:var(--ok);font-weight:600;background:var(--ok-bg);border-radius:6px;padding:1px 6px}
.gapline .wrong-w{color:var(--bad);text-decoration:line-through;background:var(--bad-bg);border-radius:6px;padding:1px 6px}
.gapline .fix-w{color:var(--ok);font-weight:600;margin-left:3px}
.gram{white-space:pre-wrap;line-height:1.65;font-size:15px}
.gram table{border-collapse:collapse;width:100%;margin:6px 0;white-space:normal}
.gram td,.gram th{border:1px solid var(--line);padding:6px 9px;text-align:left;font-size:14px}
.gram th{background:var(--soft);font-weight:500}
.gex{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 14px;font-size:14px}
.duo{display:inline-block;font-size:11.5px;color:var(--duo);font-weight:600}
.eyebtn{border:0;background:none;padding:2px 6px;font-size:18px;cursor:pointer;color:var(--muted);border-radius:8px}
.gram-wrap{max-width:860px;width:100%;margin:0 auto}
.gram-title{text-align:center;font-size:clamp(26px,4vw,34px);margin:4px 0 0}
.gram-paper{background:#FFFFFF;color:#3F3633;border:1px solid var(--line);border-radius:14px;padding:clamp(16px,4vw,34px);line-height:1.65;font-size:15.5px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.gram-paper h1,.gram-paper h2{font-family:var(--serif);font-size:26px;margin:6px 0 8px;font-weight:500;color:inherit}
.gram-paper h3{font-family:var(--serif);font-size:19px;margin:14px 0 4px;font-weight:500}
.gram-paper ul,.gram-paper ol{margin:4px 0 8px;padding-left:24px}
.gram-paper table{border-collapse:collapse;width:100%;margin:8px 0}
.gram-paper td,.gram-paper th{border:1px solid #E3D6CF;padding:7px 10px;text-align:left;vertical-align:top;min-width:40px}
.gram-paper th{font-weight:600}
.gram-ed{min-height:380px;outline:none}
.gram-ed:focus{box-shadow:0 0 0 2px var(--accent)}
.gtools{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;flex-direction:column;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.gtrow{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.gtb{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:5px 10px;font-size:13px;min-height:34px}
.gtb:hover{background:var(--soft)}
.gsel{display:inline-flex;flex-direction:row;align-items:center;gap:6px}.gsel select{width:auto;padding:5px 8px;font-size:13px}
.gsep{width:1px;height:22px;background:var(--line);margin:0 3px}
.gsw{width:26px;height:26px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);padding:0;cursor:pointer;flex:none}
.gpick{display:inline-grid;place-items:center;font-size:15px;color:var(--ink);background:var(--panel);position:relative;overflow:hidden}
.gpick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;padding:0;border:0}
.prof{display:flex;flex-direction:column;gap:18px;padding:22px 24px}
.prof-top{display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.prof-id{flex:1;min-width:220px;display:flex;flex-direction:column;gap:8px}
.prof-id h2{font-size:clamp(24px,3vw,30px);margin:0}
.prof-cta{display:flex;flex-wrap:wrap;gap:8px}
.prof-cta .btn{padding:11px 18px;font-size:14.5px}
.prof-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px 18px;border-top:1px solid var(--line);padding-top:16px}
.pi{display:flex;flex-direction:column;gap:3px;font-size:14px;min-width:0}
.prof .k,.pi .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.prof-access{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;background:var(--soft);border-radius:12px;padding:12px 14px}
.plink{font-size:12.5px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 9px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.pinpill{font-size:12.5px;background:var(--ink);color:var(--bg);border-radius:999px;padding:3px 11px;letter-spacing:.04em}
@media (max-width:560px){.prof{padding:16px}.prof-cta{width:100%}.prof-cta .btn{flex:1;justify-content:center}}
.gwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel);-webkit-overflow-scrolling:touch}
.ggrid{display:grid;grid-template-columns:44px repeat(7,minmax(118px,1fr));min-width:870px;position:relative;padding-bottom:6px}
.gtime{position:relative;margin-top:42px;height:var(--h)}
.gtime span{position:absolute;right:6px;transform:translateY(-50%);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.gday{border-left:1px solid var(--line);min-width:0}
.gday.today .ghead{color:var(--accent)} .gday.today{background:linear-gradient(var(--soft),transparent 60px)}
.ghead{height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12.5px;line-height:1.2;border-bottom:1px solid var(--line)}
.ghead span{color:var(--muted);font-size:11.5px}

<script>
(() => {
"use strict";
// ============================================================ utilidades
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => ymd(new Date());
const fmtDate = iso => { if (!iso) return ""; const [y, m, d] = iso.slice(0, 10).split("-"); return `${d}/${m}/${y}`; };
const fmtDM = iso => iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}` : "";
const money = n => "R$ " + Number(n || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const num = s => { s = String(s ?? "").replace(/[^\d,.-]/g, ""); if (s.includes(",")) s = s.replace(/\./g, "").replace(",", "."); const n = parseFloat(s); return isFinite(n) ? n : 0; };
const toMin = h => { const [a, b] = String(h || "0:0").split(":").map(Number); return a * 60 + (b || 0); };
const toHM = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
let MONTHS = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
let WD = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
let WD_FULL = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const WEEK_ORDER = [1,2,3,4,5,6,0];
const LEVELS = ["A1","A2","B1","B2","C1","C2"];
const ORIGENS = ["Indicação","Instagram","WhatsApp","Google","Ex-aluno","Outro"];
const norm = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[’']/g, "'").replace(/[^a-z0-9' ]/g, " ").replace(/\s+/g, " ").trim();
const words = s => (String(s).trim().match(/\S+/g) || []).length;
const initials = n => String(n).split(/\s+/).filter(Boolean).slice(0, 2).map(s => s[0]).join("").toUpperCase();
const avatar = (a, cls = "") => `<span class="avatar ${cls}">${a.tema && a.tema.foto ? `<img src="${a.tema.foto}" alt="">` : esc(initials(a.apelido || a.nome))}</span>`;
function confirmBtn(btn, label, fn) { btn.addEventListener("click", () => { if (!btn.dataset.c) { btn.dataset.c = 1; const old = btn.textContent; btn.textContent = label; setTimeout(() => { delete btn.dataset.c; btn.textContent = old; }, 3500); return; } fn(); }); }

// ============================================================ atividades: formato de texto
function parseActivity(text) {
  const items = []; let cur = null;
  for (const raw of String(text).split(/\r?\n/)) {
    const line = raw.trim(); if (!line) { cur = null; continue; }
    if (line.startsWith("?")) { cur = { t: "mc", p: line.slice(1).trim(), o: [], c: -1 }; items.push(cur); continue; }
    if (line.startsWith("!") && cur && cur.t === "mc") { cur.ex = line.slice(1).trim(); continue; }
    if ((line.startsWith("*") || line.startsWith("-")) && cur && cur.t === "mc") { if (line.startsWith("*")) cur.c = cur.o.length; cur.o.push(line.slice(1).trim()); continue; }
    if (line.startsWith("_")) { items.push({ t: "gap", p: line.slice(1).trim() }); cur = null; continue; }
    if (/^w:/i.test(line)) { const [p, m] = line.slice(2).split("|"); items.push({ t: "write", p: p.trim(), min: parseInt(m) || 0 }); cur = null; continue; }
    if (line.startsWith(">")) { items.push({ t: "info", p: line.slice(1).trim() }); cur = null; continue; }
  }
  return items.filter(i => i.t !== "mc" || (i.o.length >= 2 && i.c >= 0));
}
const serializeActivity = items => items.map(i => i.t === "mc" ? `? ${i.p}\n` + i.o.map((o, k) => (k === i.c ? "* " : "- ") + o).join("\n") + (i.ex ? `\n! ${i.ex}` : "")
  : i.t === "gap" ? `_ ${i.p}` : i.t === "write" ? `W: ${i.p}${i.min ? " | " + i.min : ""}` : `> ${i.p}`).join("\n\n");
const gapAnswers = p => [...String(p).matchAll(/\[([^\]]+)\]/g)].map(m => m[1].split("|").map(s => s.trim()));
function itemPoints(i) { if (i.t === "img") return (i.campos || []).length; return i.t === "mc" || i.t === "tf" || i.t === "order" ? 1 : i.t === "gap" ? gapAnswers(i.p).length : i.t === "match" ? i.pairs.filter(([l, r]) => String(l).trim() && String(r).trim()).length : 0; }
const autoTotal = t => t.itens.reduce((n, i) => n + itemPoints(i), 0) + (t.musica && t.musica.letra ? gapAnswers(t.musica.letra).length : 0);
const hasWriting = t => t.itens.some(i => i.t === "write");
function grade(t, resp) {
  let ok = 0, tot = 0; const detail = {};
  t.itens.forEach((i, k) => {
    if (i.t === "mc") { tot++; const r = resp[k] === i.c; if (r) ok++; detail[k] = r; }
    if (i.t === "tf") { tot++; const r = resp[k] === i.v; if (r) ok++; detail[k] = r; }
    if (i.t === "order") { tot++; const r = norm(resp[k]) === norm(i.s); if (r) ok++; detail[k] = r; }
    if (i.t === "gap") { const g = resp[k] || []; detail[k] = gapAnswers(i.p).map((alts, j) => { tot++; const r = alts.some(x => norm(x) === norm(g[j])); if (r) ok++; return r; }); }
    if (i.t === "match") { const g = resp[k] || []; detail[k] = i.pairs.map(([, rgt], j) => { tot++; const r = norm(g[j]) === norm(rgt); if (r) ok++; return r; }); }
    if (i.t === "img") { const g = resp[k] || []; detail[k] = (i.campos || []).map((f, j) => { tot++; const r = imgOk(f, g[j]); if (r) ok++; return r; }); }
  });
  return { ok, tot, detail };
}

// ---------- lacunas por toque: a Fabi cola o texto e toca nas palavras que o aluno completa
const GAP_TOK = /(\[[^\]]*\])|([A-Za-zÀ-ÖØ-öø-ÿ0-9]+(?:['’\-][A-Za-zÀ-ÖØ-öø-ÿ0-9]+)*)|([^\[A-Za-zÀ-ÖØ-öø-ÿ0-9]+|\[)/g;
const gapTokens = p => [...String(p || "").matchAll(GAP_TOK)].map(m => m[1] ? { t: "b", v: m[1] } : m[2] ? { t: "w", v: m[2] } : { t: "s", v: m[3] });
function gapToggle(p, idx) { const T = gapTokens(p), x = T[idx]; if (!x) return p;
  if (x.t === "w") x.v = "[" + x.v + "]"; else if (x.t === "b") x.v = x.v.slice(1, -1).split("|")[0].trim() || "";
  return T.map(y => y.v).join(""); }
function gapSetAnswer(p, j, val) { let n = -1; return String(p).replace(/\[([^\]]*)\]/g, (m, x) => ++n === j ? "[" + String(val).replace(/[\[\]]/g, "") + "]" : m); }
function gapPickHtml(p) { const T = gapTokens(p);
  return T.length ? T.map((x, i) => x.t === "s" ? esc(x.v) : `<button type="button" class="gw ${x.t === "b" ? "on" : ""}" data-gi="${i}" aria-pressed="${x.t === "b"}">${esc(x.t === "b" ? x.v.slice(1, -1).split("|").join(" / ") || "?" : x.v)}</button>`).join("")
    : `<span class="hint">Escreva ou cole o texto acima.</span>`; }
function gapAnsHtml(p, bank) { const A = gapAnswers(p), B = (bank || []).filter(Boolean);
  if (!A.length) return "";
  if (B.length) return A.map((alts, j) => { const cur = alts.join("|").trim(), inB = B.some(o => norm(o) === norm(cur));
    return `<label class="gapans"><span>Lacuna ${j + 1}</span><select data-ga="${j}" aria-label="Resposta da lacuna ${j + 1}" style="${cur ? "" : "border-color:var(--bad)"}"><option value="">Escolha a resposta certa…</option>${B.map((o, k) => `<option value="${esc(o)}" ${norm(o) === norm(cur) ? "selected" : ""}>${k + 1}. ${esc(o)}</option>`).join("")}${cur && !inB ? `<option value="${esc(cur)}" selected>${esc(cur)}</option>` : ""}</select></label>`; }).join("")
    + `<span class="hint">O aluno vê uma lista com as ${B.length} opções em cada lacuna.</span>`;
  return A.map((alts, j) => `<label class="gapans"><span>Lacuna ${j + 1}</span><input data-ga="${j}" value="${esc(alts.join(" | "))}" aria-label="Resposta da lacuna ${j + 1}" style="${alts.join("").trim() ? "" : "border-color:var(--bad)"}"></label>`).join("")
    + `<span class="hint">Para aceitar mais de uma resposta, separe com | (ex.: lives | is living).</span>`; }
// liga a caixa de texto (ta) ao seletor de palavras (pick) e às respostas (ans); onChange recebe o texto novo
function bindGapWidget(ta, pick, ans, onChange, getBank) {
  const redraw = (keepAns) => { pick.innerHTML = gapPickHtml(ta.value); translate(pick); if (!keepAns) { ans.innerHTML = gapAnsHtml(ta.value, getBank && getBank()); translate(ans); bindAns(); } bindPick(); };
  const commit = (keepAns) => { onChange(ta.value); growTa(ta); redraw(keepAns); };
  const bindPick = () => $$("[data-gi]", pick).forEach(b => b.addEventListener("click", () => { ta.value = gapToggle(ta.value, +b.dataset.gi); commit(false); }));
  const bindAns = () => $$("[data-ga]", ans).forEach(inp => inp.addEventListener(inp.tagName === "SELECT" ? "change" : "input", () => { ta.value = gapSetAnswer(ta.value, +inp.dataset.ga, inp.tagName === "SELECT" ? inp.value : inp.value.split("|").map(x => x.trim()).filter(Boolean).join("|")); inp.style.borderColor = inp.value ? "" : "var(--bad)"; commit(true); }));
  ta._gapRedraw = () => redraw(false);
  ta.addEventListener("input", () => { onChange(ta.value); redraw(false); });
  redraw(false);
}
const speakerBold = h => h.replace(/(^|\n)([A-ZÀ-Ö][\wÀ-ÿ'’ .-]{0,24}:)(?=\s)/g, "$1<b style=\"font-weight:600\">$2</b>"); // "Waiter:" em negrito
const infoHtml = t => { const L = String(t || "").split("\n").filter(x => x.trim()); // lista numerada (caixa de opções) vira grade
  return L.length >= 4 && L.every(x => /^\s*\d{1,3}\.\s/.test(x)) ? `<div class="bankbox" data-notr>${L.map(x => { const m = x.match(/^\s*(\d{1,3})\.\s*(.*)$/); return `<span><b>${m[1]}.</b> ${esc(m[2])}</span>`; }).join("")}</div>`
    : `<div class="instr" style="white-space:pre-wrap" data-notr>${speakerBold(esc(t))}</div>`; };
const bankHtml = B => B && B.length ? `<div class="bankbox" data-notr>${B.map((o, k) => `<span><b>${k + 1}.</b> ${esc(o)}</span>`).join("")}</div>` : "";
// caixas de texto que crescem sozinhas (sem barra de rolagem)
function growTa(ta) { if (!ta || !ta.isConnected || ta.offsetParent === null) return; ta.style.height = "auto"; ta.style.height = (ta.scrollHeight + 2) + "px"; }
const growAll = (root = document) => $$("textarea", root).forEach(growTa);
document.addEventListener("input", e => { if (e.target && e.target.tagName === "TEXTAREA") growTa(e.target); });
window.addEventListener("resize", () => growAll());

function imgLetras(s) {
  s = String(s || "a-g").trim();
  let m = s.match(/^([a-z])\s*[-–até]+\s*([a-z])$/i);
  if (m) { const a = m[1].toLowerCase().charCodeAt(0), b = m[2].toLowerCase().charCodeAt(0); return Array.from({ length: Math.max(0, b - a + 1) }, (_, i) => String.fromCharCode(a + i)); }
  m = s.match(/^(\d{1,3})\s*[-–até]+\s*(\d{1,3})$/i);
  if (m) return Array.from({ length: Math.max(0, +m[2] - +m[1] + 1) }, (_, i) => String(+m[1] + i));
  return s.split(/[\s,;·]+/).map(x => x.trim()).filter(Boolean);
}

  for (let i = 0; i < blocks.length; i++) { const b = blocks[i]; if (b.kind === "p" && b.text.trim().length < 50 && (/^\s*(answers?|gabarito|respostas?|key|corre[cç][aã]o)\s*:?\s*$/i.test(b.text) || /answer\s*key|gabarito|answers\s*$/i.test(b.text))) { cut = i; break; } }
  blocks.slice(cut + 1).forEach(b => { const lines = b.kind === "table" ? b.rows.map(r => r.join(" ")) : String(b.text).split(/\n|;|,(?=\s*\d)/);
    lines.forEach(l => { const m = l.match(/^\s*\(?(\d{1,3})\)?\s*[-–—.:)=]\s*(.+?)\s*$/); if (m) key[+m[1]] = m[2].trim(); }); });
  blocks = blocks.slice(0, cut);
  // 2) título do documento
  let titulo = ""; const first = blocks.find(b => b.kind === "p" && b.text.trim());
  if (first && (/^(title|t[ií]?tulo\d*$)/i.test(first.style) || (first.text.trim().length < 70 && !/[.?!:]$/.test(first.text.trim()) && blocks.indexOf(first) < 2))) { titulo = first.text.trim(); blocks = blocks.filter(b => b !== first); }
  const BLANK = /_{3,}|\.{4,}|…{2,}/;
  const items = []; let buf = [], bank = null, curMc = null, gapN = 0, lone = false;
  const numbered = blocks.some(b => b.kind === "p" && /\(\s*\d{1,3}\s*\)\s*(?:_{3,}|\.{4,}|…{2,})/.test(b.text)); // o gabarito vale para as lacunas numeradas
  const laterBlanks = i => blocks.slice(i + 1).some(b => b.kind === "p" && (BLANK.test(b.text) || /\[[^\]]+\]/.test(b.text)));
  const numItem = s => { const m = String(s).match(/^\s*(\d{1,3})\s*[.)\-–]\s*(.+)$/); return m ? [+m[1], m[2].trim()] : null; };
  const optRx = /^(?:\(\s*([xX✓✔*]?)\s*\)|\[\s*([xX✓✔]?)\s*\]|([a-eA-E])\s*[\)\.\-])\s*(.+)$/, tfRx = /^\(\s*([VFTvft])\s*\)\s*(.+)$/, numRx = /^\s*(\d+|[ivx]+)\s*[\.\)\-]\s+/i;
  const ans = n => { let a = key[n]; if (a == null) return "";
    const both = a.match(/^(\d{1,3})\s*[-–—:.)=]\s*(.+)$/); // "5 — A booking": número da caixa + texto
    if (both) a = bank && bank[+both[1] - 1] ? bank[+both[1] - 1] : both[2];
    else if (/^\d{1,3}$/.test(a) && bank && bank[+a - 1]) a = bank[+a - 1];
    return a.replace(/[\[\]]/g, "").trim(); };
  const gapLine = line => line.replace(/(?:\(\s*(\d{1,3})\s*\)\s*)?(?:_{3,}|\.{4,}|…{2,})(?:\s*\(([^()]+)\))?/g, (m, n, inl) => { const k = n ? +n : ++gapN; if (n) gapN = Math.max(gapN, +n);
    const a = inl && !/^\d+$/.test(inl.trim()) && !bank ? inl.trim() : (n || !numbered) ? ans(k) : ""; return `${n ? `(${n}) ` : ""}[${a || " "}]`; });
  const flush = () => { if (!buf.length) return; const text = buf.join("\n").trim(); buf = [];
    if (!text) return;
    if (BLANK.test(text) || /\[[^\]]+\]/.test(text)) items.push(Object.assign({ t: "gap", p: gapLine(text) }, bank ? { bank: bank.slice() } : {}));
    else items.push({ t: "info", p: text }); };
  for (const [bi, b] of blocks.entries()) {
    if (b.kind === "table") { flush(); curMc = null;
      const cells = b.rows.flat().filter(Boolean), nums = cells.map(numItem).filter(Boolean);
      if (!nums.length && cells.length >= 4 && cells.every(c => c.length <= 40) && laterBlanks(bi)) { // caixa de palavras sem número
        bank = cells.slice(); items.push({ t: "info", p: bank.map((x, i) => `${i + 1}. ${x}`).join("\n") }); continue; }
      if (nums.length >= 3 && nums.length >= cells.length * .6) { // caixa de opções numerada
        bank = []; nums.sort((x, y) => x[0] - y[0]).forEach(([n, t]) => { bank[n - 1] = t; }); bank = bank.map((x, i) => x || `(${i + 1})`);
        items.push({ t: "info", p: bank.map((x, i) => `${i + 1}. ${x}`).join("\n") });
      } else if (b.rows.length) items.push({ t: "info", p: b.rows.map(r => r.filter(Boolean).join("  |  ")).filter(Boolean).join("\n") });
      continue; }
    let line = String(b.text).replace(/[ \t]+/g, " ").trim(); if (!line) { continue; }
    const wasLone = lone; lone = false;
    const exm = line.match(/^(?:explica[çc][ãa]o|explanation|por ?qu[eê]|why|dica|tip)\s*[:\-–]\s*(.+)$/i), last = items[items.length - 1];
    if (exm && !buf.length && last && (last.t === "mc" || last.t === "tf")) { last.ex = exm[1].trim(); curMc = null; continue; }
    const tf = line.match(tfRx);
    if (tf && !/^\(\s*[xX]\s*\)/.test(line)) { flush(); curMc = null; items.push({ t: "tf", p: tf[2].trim(), v: /[VvTt]/.test(tf[1]) }); continue; }
    const op = line.match(optRx);
    if (op && (curMc || buf.length)) {
      if (!curMc) { const q = buf.pop(); flush(); curMc = { t: "mc", p: q.replace(numRx, "").replace(/_{3,}/g, "___"), o: [], c: -1 }; items.push(curMc); }
      let txt = op[4].trim(); const mark = /[xX✓✔*]/.test(op[1] || op[2] || "") || /\s*(✓|✔|\*)$/.test(txt) || b.strong;
      txt = txt.replace(/\s*(✓|✔|\*)$/, "").trim(); if (mark && curMc.c < 0) curMc.c = curMc.o.length; curMc.o.push(txt); continue;
    }
    curMc = null; if (wasLone) flush();
    const heading = isHeadStyle(b.style) || (b.strong && line.length < 60 && !/^\(/.test(line) && !/[.?:!_]$/.test(line) && !BLANK.test(line) && !/\[[^\]]+\]/.test(line) && !/^[^:]{1,25}:\s/.test(line));
    if (heading) { flush(); items.push({ t: "info", p: line }); continue; }
    if (/^(write|escreva|writing|reda[çc][ãa]o|compose|describe|descreva)\b/i.test(line)) { flush(); items.push({ t: "write", p: line, min: 0 }); continue; }
    // questão numerada isolada com lacuna ("2. They ____ (live) …") fica como questão própria
    if (numRx.test(line) && !bank && (BLANK.test(line) || /\[[^\]]+\]/.test(line) || /\?$/.test(line))) { flush(); buf.push(line.replace(numRx, "")); lone = true; continue; }
    buf.push(line);
  }
  flush();
  // instrução seguida de outra instrução vira um bloco só
  const merged = [];
  items.forEach(i => { const l = merged[merged.length - 1]; if (i.t === "info" && l && l.t === "info" && !/\n\d+\. /.test(l.p) && !/^\d+\. /.test(i.p) && l.p.length > 60 && i.p.length > 60) l.p += "\n\n" + i.p; else merged.push(i); });
  merged.titulo = titulo;
  return merged;
}

// ---------- aplicar o que o aluno fez (painel)

    if (!e || !t || e.status !== "pendente") return;
    const g = gradeFull(t, p.respostas || {});
    Object.assign(e, { respostas: p.respostas || {}, acertos: g.ok, total: g.tot, feito: (it.criado || new Date().toISOString()).slice(0, 10), status: hasWriting(t) ? "corrigir" : "feito" });

    if (it.pela_fabi) { DB.eventos.push({ id: uid(), aluno: a.id, data: p.data, hora: p.hora, dur: p.dur, tipo: "reposicao", ref, obs: "Marcada na aula", pelo: "fabi" }); }
    else { DB.eventos.push({ id: uid(), aluno: a.id, data: p.data, hora: p.hora, dur: p.dur, tipo: "reposicao", ref, obs: "Pedida pelo aluno", pelo: "aluno", pelo_aluno: true, aprovacao: "pendente" });
      nov(`${a.apelido || a.nome} pediu reposição para ${fmtDate(p.data)} às ${p.hora}${ref ? ` (falta de ${fmtDate(ref)})` : ""} · aceite na Agenda`); }

function gradeFull(t, resp) {

  if (t.musica && t.musica.letra) { const given = resp.letra || []; g.detail.letra = gapAnswers(t.musica.letra).map((alts, j) => { g.tot++; const r = alts.some(x => norm(x) === norm(given[j])); if (r) g.ok++; return r; }); }

      out.push({ data: ds, hora: s.hora, dur: s.dur, tipo: e ? e.tipo : "normal" }); });
  }

  D.ocupado.aulas.forEach(x => { if (x.ativo === false || ds < (x.inicio || "0000")) return; (x.aulas || []).filter(s => s.dia === dow).forEach(s => {
    const off = D.ocupado.eventos.some(e => e.aluno === x.id && e.data === ds && e.hora === s.hora && (e.tipo === "falta" || e.tipo === "cancelada"));

  } catch (e) {} finally { pulling = false; }

  setInterval(() => { if (logged && document.visibilityState === "visible") pullInbox(); }, 60000);
  window.addEventListener("focus", () => { if (logged) pullInbox(); });
} else render();
})();
</script>
