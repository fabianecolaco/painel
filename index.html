<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Painel Teacher Fabi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Poppins:wght@300;400;500;600&family=Nunito:wght@400;600;700&family=Caveat:wght@500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
/* Layout: painel da professora com abas (Agenda, Alunos, Financeiro, Atividades, Correções, Ajustes); perfis e ações abrem em páginas internas e painéis laterais */
:root{
  --bg:#FAF6F2; --panel:#FFFFFF; --ink:#3F3633; --muted:#8C7F7A; --line:#EADFD8; --field:#FFFDFB;
  --accent:#B88378; --accent-ink:#FFFFFF; --soft:#F3E2DA; --gold:#CFA22B; --gold-soft:#F9EAB8;
  --ok:#4F8462; --ok-bg:#E4EFE7; --warn:#A8721F; --warn-bg:#F7EAD3; --bad:#B4554B; --bad-bg:#F6E1DE; --info:#5F7E98; --info-bg:#E3EBF2;
  --on-accent:#FFFFFF; --lvl-bg:#3F3633; --lvl-ink:#FFFFFF; --priv-bg:#FFF8E8; --priv-line:#E5C77F; --priv-ink:#A8721F;
  --ev-ink:#7A4E45; --extra-ink:#7A5B0E; --cancel-bg:#EEEEEE; --cancel-ink:#8A8482; --free-bg:#F6FBF7; --free-line:#BFD6C5; --overlay:rgba(40,30,28,.35);
  --deco-a:#F1DCD3; --deco-b:#F3E2DA; --deco-ring:rgba(184,131,120,.35);
  --serif:"Playfair Display", Georgia, serif; --sans:"Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
:root[data-mode="dark"]{
  --bg:#1E1A19; --panel:#282321; --ink:#F2EAE6; --muted:#ADA19C; --line:#3D3532; --field:#231F1D;
  --accent:#D29C90; --accent-ink:#2A1F1C; --soft:#4A3530; --gold:#E0B84A; --gold-soft:#4A3F1F;
  --ok:#8FC4A0; --ok-bg:#22382B; --warn:#E2B867; --warn-bg:#3E3220; --bad:#E39088; --bad-bg:#44282A; --info:#9FBCD6; --info-bg:#26323D;
  --on-accent:#2A1F1C; --lvl-bg:#F2EAE6; --lvl-ink:#2A2321; --priv-bg:#352D20; --priv-line:#7A6533; --priv-ink:#E2B867;
  --ev-ink:#F0CFC6; --extra-ink:#F1D58A; --cancel-bg:#3A3533; --cancel-ink:#A39A97; --free-bg:#1F2C25; --free-line:#3F5E4B; --overlay:rgba(0,0,0,.55);
  --deco-a:#3A2A26; --deco-b:#332724; --deco-ring:rgba(210,156,144,.28);
  color-scheme:dark;
}
.bgdeco{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.bgdeco i{position:absolute;border-radius:50%;display:block}
.bgdeco .g{right:-180px;bottom:-200px;width:760px;height:760px;background:radial-gradient(circle,var(--deco-a) 0%,transparent 68%)}
.bgdeco .c{right:-120px;bottom:-120px;width:460px;height:460px;background:var(--deco-b)}
.bgdeco .r{right:40px;bottom:60px;width:560px;height:560px;border:1.5px solid var(--deco-ring)}
.bgdeco .l{right:120px;top:90px;width:220px;height:0;border-top:1.5px solid var(--deco-ring);border-radius:0}
@media (max-width:720px){.bgdeco .g{width:420px;height:420px}.bgdeco .c{width:260px;height:260px}.bgdeco .r{width:320px;height:320px;right:-40px}.bgdeco .l{display:none}}
.toggles{display:inline-flex;gap:6px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.seg button{border:none;background:none;padding:5px 11px;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
[hidden]{display:none!important}
.wrap{max-width:1160px;margin:0 auto;padding-top:22px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(26px,4.6vw,36px)} h2{font-size:22px} h3{font-size:17px}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
.muted{color:var(--muted)} .small{font-size:12px} .hint{font-size:11.5px;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0} .stack.tight{gap:8px}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:560px){.row,.row3{grid-template-columns:minmax(0,1fr)}}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:920px){.cols{grid-template-columns:minmax(0,1fr)}}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:90px;line-height:1.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer}
.btn{font-size:13.5px;font-weight:500;border-radius:10px;padding:9px 15px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn:disabled{opacity:.55;cursor:default}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.link{background:none;border:none;color:var(--accent);padding:2px 4px;font-size:12.5px}
.link.danger{color:var(--bad)}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:10px 14px;color:var(--muted);font-size:14px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:500;background:var(--soft);color:var(--ink);white-space:nowrap}
.badge.lvl{background:var(--lvl-bg);color:var(--lvl-ink);letter-spacing:.04em}
.badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.warn{background:var(--warn-bg);color:var(--warn)} .badge.bad{background:var(--bad-bg);color:var(--bad)} .badge.info{background:var(--info-bg);color:var(--info)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.scard{display:flex;gap:12px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;color:inherit;width:100%}
.scard:hover{border-color:var(--accent)}
.lvlhead{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.avatar{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--soft);color:var(--accent);font-family:var(--serif);font-size:18px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.lg{width:80px;height:80px;font-size:30px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel)}
.panel .item{background:var(--field)}
.item .t{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis}
.item .acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center}
.score{font-family:var(--serif);font-size:18px;font-variant-numeric:lining-nums tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel)}
.kpi .k{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--serif);font-size:22px;font-variant-numeric:lining-nums tabular-nums}
.kpi .v.ok{color:var(--ok)} .kpi .v.warn{color:var(--warn)}
.private{background:var(--priv-bg);border:1px dashed var(--priv-line);border-radius:12px;padding:14px}
.private .eyebrow{color:var(--priv-ink)}
.entry{border-left:2px solid var(--soft);padding:4px 0 4px 14px}
.entry .d{font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.empty{color:var(--muted);font-size:13px;padding:16px;border:1px dashed var(--line);border-radius:12px;text-align:center}
.status{min-height:18px;font-size:12.5px;color:var(--muted);margin:0}
pre.fmt{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12px;white-space:pre-wrap;margin:0;overflow-x:auto}
fieldset.group{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0;display:flex;flex-direction:column;gap:12px;min-width:0}
fieldset.group legend{font-family:var(--serif);font-size:15px;padding:0 6px;color:var(--ink)}
@media (max-width:560px){.item{grid-template-columns:minmax(0,1fr)}.item .acts{justify-content:flex-start}}

/* calendário do aluno */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0}
.cal .day{min-height:58px;border:1px solid var(--line);border-radius:9px;padding:5px 6px;background:var(--panel);text-align:left;display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink)}
.cal .day.out{visibility:hidden}
.cal .day.today{border-color:var(--ink)}
.cal .day .n{font-variant-numeric:tabular-nums;color:var(--muted)}
.cal .ev{border-radius:5px;padding:1px 5px;font-size:10.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.normal{background:var(--soft);color:var(--ev-ink)}
.ev.falta{background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
.ev.cancelada{background:var(--cancel-bg);color:var(--cancel-ink);text-decoration:line-through}
.ev.reposicao{background:var(--info-bg);color:var(--info)}
.ev.extra{background:var(--gold-soft);color:var(--extra-ink)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* agenda semanal */
.week{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px;overflow-x:auto;padding-bottom:4px}
.wcol{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.wcol.today{border-color:var(--ink)}
.wcol h4{margin:0;font-family:var(--serif);font-weight:500;font-size:15px}
.wcol .date{font-size:11px;color:var(--muted)}
.slot{border-radius:9px;padding:6px 8px;font-size:12px;text-align:left;border:1px solid transparent;width:100%;color:var(--ink)}
.slot b{font-weight:600;font-variant-numeric:tabular-nums}
.slot.normal{background:var(--soft)} .slot.reposicao{background:var(--info-bg)} .slot.extra{background:var(--gold-soft)}
.slot.falta{background:var(--bad-bg);text-decoration:line-through;color:var(--bad)} .slot.cancelada{background:var(--cancel-bg);color:var(--cancel-ink);text-decoration:line-through}
.free{font-size:11px;color:var(--ok);border:1px dashed var(--free-line);border-radius:8px;padding:4px 7px;background:var(--free-bg)}
@media (max-width:720px){.week{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.cal .day{min-height:46px;padding:4px}.cal .ev{font-size:0;height:7px;padding:0;border-radius:4px}}

/* painel lateral */
.sheet{position:fixed;inset:0;background:var(--overlay);display:flex;justify-content:flex-end;z-index:40}
.sheet-inner{width:min(560px,100%);height:100%;overflow-y:auto;background:var(--bg);border-left:1px solid var(--line);
  padding:max(18px,env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) max(18px,env(safe-area-inset-bottom,0px)) 18px;display:flex;flex-direction:column;gap:14px}
.sheet-inner.wide{width:min(1000px,100%)}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:16px;flex:none}
.canvasbox{width:100%;aspect-ratio:1/1;max-width:100%;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--soft)}
.canvasbox img{display:block;width:100%;height:100%}

.docthumb{display:block;width:100%;aspect-ratio:4/3;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--field);padding:0}
.docthumb img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.docthumb.zip{display:grid;place-items:center;background:var(--soft)}
.docthumb.zip span{width:64px;height:64px;border-radius:50%;border:1.5px solid var(--accent);display:grid;place-items:center;font-family:var(--serif);font-size:24px;color:var(--ink)}
/* login */
.login{max-width:420px;margin:8vh auto 0;width:100%}
.login .mono{width:68px;height:68px;border-radius:50%;border:1.5px solid var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:500;font-size:28px;line-height:1;letter-spacing:-1px;padding-bottom:3px;margin-bottom:6px;color:var(--ink)}
.login .mono i{font-style:italic;font-weight:400;color:var(--accent);margin-left:1px}

/* atividade (prévia) */
.q{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--panel);display:flex;flex-direction:column;gap:10px}
.q .n{font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.q .p{font-size:15px}
.opt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--field);font-size:14px;color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)} .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.gapline{font-size:15px;line-height:2.1}
.gapline input{display:inline-block;width:auto;min-width:90px;padding:3px 8px;margin:0 3px}
.fix{font-size:12px;color:var(--ok);margin-left:2px}
.instr{font-family:var(--serif);font-size:17px;padding-top:4px}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.vocab div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--field)}
.vocab b{font-family:var(--serif);font-weight:500;font-size:16px;display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="bgdeco" aria-hidden="true"><i class="g"></i><i class="c"></i><i class="r"></i></div>
<div class="wrap" id="app"></div>
<div class="sheet" id="sheet" hidden><div class="sheet-inner" id="sheetInner" role="dialog" aria-modal="true"></div></div>
<canvas id="cv" width="1080" height="1080" hidden></canvas>

<script>
(() => {
"use strict";
// ============================================================ utilidades
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => ymd(new Date());
const fmtDate = iso => { if (!iso) return ""; const [y, m, d] = iso.slice(0, 10).split("-"); return `${d}/${m}/${y}`; };
const fmtDM = iso => iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}` : "";
const money = n => "R$ " + Number(n || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const num = s => { s = String(s ?? "").replace(/[^\d,.-]/g, ""); if (s.includes(",")) s = s.replace(/\./g, "").replace(",", "."); const n = parseFloat(s); return isFinite(n) ? n : 0; };
const toMin = h => { const [a, b] = String(h || "0:0").split(":").map(Number); return a * 60 + (b || 0); };
const toHM = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
let MONTHS = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
let WD = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
let WD_FULL = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const WEEK_ORDER = [1,2,3,4,5,6,0];
const LEVELS = ["A1","A2","B1","B2","C1","C2"];
const ORIGENS = ["Indicação","Instagram","WhatsApp","Google","Ex-aluno","Outro"];
const norm = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[’']/g, "'").replace(/[^a-z0-9' ]/g, " ").replace(/\s+/g, " ").trim();
const words = s => (String(s).trim().match(/\S+/g) || []).length;
const initials = n => String(n).split(/\s+/).filter(Boolean).slice(0, 2).map(s => s[0]).join("").toUpperCase();
const avatar = (a, cls = "") => `<span class="avatar ${cls}">${a.tema && a.tema.foto ? `<img src="${a.tema.foto}" alt="">` : esc(initials(a.apelido || a.nome))}</span>`;
function confirmBtn(btn, label, fn) { btn.addEventListener("click", () => { if (!btn.dataset.c) { btn.dataset.c = 1; const old = btn.textContent; btn.textContent = label; setTimeout(() => { delete btn.dataset.c; btn.textContent = old; }, 3500); return; } fn(); }); }

// ============================================================ atividades: formato de texto
function parseActivity(text) {
  const items = []; let cur = null;
  for (const raw of String(text).split(/\r?\n/)) {
    const line = raw.trim(); if (!line) { cur = null; continue; }
    if (line.startsWith("?")) { cur = { t: "mc", p: line.slice(1).trim(), o: [], c: -1 }; items.push(cur); continue; }
    if ((line.startsWith("*") || line.startsWith("-")) && cur && cur.t === "mc") { if (line.startsWith("*")) cur.c = cur.o.length; cur.o.push(line.slice(1).trim()); continue; }
    if (line.startsWith("_")) { items.push({ t: "gap", p: line.slice(1).trim() }); cur = null; continue; }
    if (/^w:/i.test(line)) { const [p, m] = line.slice(2).split("|"); items.push({ t: "write", p: p.trim(), min: parseInt(m) || 0 }); cur = null; continue; }
    if (line.startsWith(">")) { items.push({ t: "info", p: line.slice(1).trim() }); cur = null; continue; }
  }
  return items.filter(i => i.t !== "mc" || (i.o.length >= 2 && i.c >= 0));
}
const serializeActivity = items => items.map(i => i.t === "mc" ? `? ${i.p}\n` + i.o.map((o, k) => (k === i.c ? "* " : "- ") + o).join("\n")

        <div class="row3" id="byClass"><label>Aulas cobradas por semana<input id="fCobSem" type="number" min="0" step="0.5" value="${a.cobranca.aulas_semana}"></label>

          <label>Cor<select id="fCor"><option value="rose" ${a.cor_card === "rose" ? "selected" : ""}>Rosé</option><option value="amarelo" ${a.cor_card === "amarelo" ? "selected" : ""}>Amarelo</option></select></label>

    </form>`);
  let modo = a.cobranca.modo;
  const drawSlots = () => {
    $("#slotList").innerHTML = slots.map((s, i) => `<div class="item"><div class="row3" style="gap:8px">
      <label>Dia<select data-i="${i}" data-k="dia">${WEEK_ORDER.map(d => `<option value="${d}" ${d === s.dia ? "selected" : ""}>${WD_FULL[d]}</option>`).join("")}</select></label>
      <label>Horário<input type="time" data-i="${i}" data-k="hora" value="${s.hora}"></label>
      <label>Duração (min)<input type="number" min="15" step="15" data-i="${i}" data-k="dur" value="${s.dur}"></label></div>
      <div class="acts"><button type="button" class="link danger" data-rm="${i}">Remover</button></div></div>`).join("") || `<div class="empty">Nenhum horário. Adicione os dias e horários fixos do aluno.</div>`;
    $$("#slotList [data-k]").forEach(el => el.addEventListener("input", () => { const s = slots[el.dataset.i]; s[el.dataset.k] = el.dataset.k === "hora" ? el.value : +el.value; calc(); }));
    $$("#slotList [data-rm]").forEach(b => b.addEventListener("click", () => { slots.splice(+b.dataset.rm, 1); drawSlots(); calc(); }));
    calc();
  };
  const calc = () => {
    $$("[data-m]").forEach(b => b.setAttribute("aria-pressed", b.dataset.m === modo));
    $("#byClass").hidden = modo !== "aula"; $("#byMonth").hidden = modo !== "mensal";
    const tmp = { aulas: slots, ativo: true, inicio: "0000", id: "_tmp", cobranca: { modo, aulas_semana: num($("#fCobSem").value), valor_aula: num($("#fValAula").value), valor_mensal: num($("#fValMes").value) } };
    const mins = slots.reduce((s, x) => s + (+x.dur || 0), 0);
    $("#slotSum").textContent = slots.length ? `${slots.length} encontro${slots.length > 1 ? "s" : ""} por semana · ${mins} min no total` : "";
    $("#perEnc").textContent = modo === "aula" && slots.length ? `= ${money(perEncontro(tmp))} por encontro` : "";
    const b = billing(tmp, now.getFullYear(), now.getMonth());
    $("#calcHint").textContent = `Em ${MONTHS[now.getMonth()].toLowerCase()}: ${b.encontros} encontros → ${money(b.valor)}. O valor de cada mês é calculado pelo calendário (quantas aulas caem naquele mês).`;
  };
  $$("[data-m]").forEach(b => b.addEventListener("click", () => { modo = b.dataset.m; calc(); }));
  ["fCobSem", "fValAula", "fValMes"].forEach(id => $("#" + id).addEventListener("input", calc));
  $("#addSlot").addEventListener("click", () => { const last = slots[slots.length - 1]; slots.push({ dia: last ? (last.dia + 1) % 7 : 1, hora: last ? last.hora : "18:00", dur: last ? last.dur : 60 }); drawSlots(); });
  drawSlots();
  const back = () => ed ? go("alunos", { name: "aluno", id: ed.id }) : go("alunos");
  $("#back").addEventListener("click", back); $("#cancel").addEventListener("click", back);
  $("#sForm").addEventListener("submit", e => { e.preventDefault();
    const nome = $("#fNome").value.trim(); if (!nome) { $("#sStatus").textContent = "Digite o nome do aluno."; return; }
    const data = { nome, apelido: $("#fApelido").value.trim(), nivel: $("#fNivel").value, cidade: $("#fCidade").value.trim(), inicio: $("#fInicio").value || today(), ativo: $("#fAtivo").checked,

      aulas: slots.filter(s => s.hora).sort((x, y) => WEEK_ORDER.indexOf(x.dia) - WEEK_ORDER.indexOf(y.dia) || x.hora.localeCompare(y.hora)),
      cobranca: { modo, aulas_semana: num($("#fCobSem").value), valor_aula: num($("#fValAula").value), valor_mensal: num($("#fValMes").value) },
      saudacao: $("#fSaud").value, cor_card: $("#fCor").value, mostrar_pix: $("#fPix").checked, obs_privada: $("#fObs").value };
    if (ed) Object.assign(ed, data);
    else { const slug = norm(data.apelido || nome).split(" ")[0] || "aluno"; DB.alunos.push(Object.assign({ id: uid(), token: slug + "-" + Math.random().toString(36).slice(2, 6), tema: { cor: "#B88378", fonte: "Poppins", foto: "" } }, data)); }
    save(); go("alunos", { name: "aluno", id: ed ? ed.id : DB.alunos[DB.alunos.length - 1].id });
  });
  $("#fNome").focus();
}

function vFinanceiro() {

  shell(`

// ---------- prévia (como o aluno vê, com gabarito)
function itemPreview(i, n) {
  const head = `<div class="n">${TYPE_LABEL[i.t]} · ${n}</div>`;
  if (i.t === "mc") return `<div class="q">${head}<div class="p">${esc(i.p)}</div>${i.o.map((o, j) => `<div class="opt ${j === i.c ? "right" : ""}">${j === i.c ? "✓" : "·"} ${esc(o)}</div>`).join("")}</div>`;
  if (i.t === "tf") return `<div class="q">${head}<div class="p">${esc(i.p)}</div><div class="btns"><span class="opt ${i.v ? "right" : ""}">True</span><span class="opt ${!i.v ? "right" : ""}">False</span></div></div>`;
  if (i.t === "gap") return `<div class="q">${head}<div class="gapline">${esc(i.p).replace(/\[([^\]]*)\]/g, (m, x) => x.trim() ? `<b style="color:var(--ok)">${esc(x.split("|").join(" / "))}</b>` : `<b style="color:var(--bad)">[ ? ]</b>`)}</div></div>`;
  if (i.t === "match") return `<div class="q">${head}<div class="p">${esc(i.p)}</div><div class="stack tight">${i.pairs.map(([l, r]) => `<div class="opt">${esc(l)} <span class="muted">→</span> <b style="font-weight:500">${esc(r)}</b></div>`).join("")}</div><div class="hint">O aluno vê a coluna da direita embaralhada.</div></div>`;
  if (i.t === "order") { const w = String(i.s).trim().split(/\s+/).filter(Boolean); return `<div class="q">${head}<div class="p">${esc(i.p)}</div><div class="chips">${shuffleStable(w).map(x => `<span class="chip">${esc(x)}</span>`).join("")}</div><div class="hint">Resposta: ${esc(i.s)}</div></div>`; }
  if (i.t === "write") return `<div class="q">${head}<div class="p">${esc(i.p)}</div><div class="hint">${i.min ? `Mínimo de ${i.min} palavras. ` : ""}Vai para a sua fila de correção.</div></div>`;
  if (i.t === "media") return `<div class="q">${head}${i.p ? `<div class="p">${esc(i.p)}</div>` : ""}<a class="btn sm" href="${esc(i.url)}" target="_blank" rel="noopener">▶ Abrir áudio/vídeo</a></div>`;
  return "";
}
function shuffleStable(arr) { const a = arr.map((x, i) => [x, (i * 7919 + arr.length * 104729) % 97]); a.sort((p, q) => p[1] - q[1]); const out = a.map(x => x[0]); return out.join(" ") === arr.join(" ") && arr.length > 1 ? out.reverse() : out; }

function linesToItems(lines) {

  for (const { text, strong } of lines) {
    let line = String(text).replace(/\s+/g, " ").trim(); if (!line) { curMc = null; continue; }
    const tf = line.match(tfRx);
    if (tf && !/^\(\s*[xX]\s*\)/.test(line)) { flush(); curMc = null; items.push({ t: "tf", p: tf[2].trim(), v: /[VvTt]/.test(tf[1]) }); continue; }
    const op = line.match(optRx);

      let txt = op[4].trim(); const mark = /[xX✓✔*]/.test(op[1] || op[2] || "") || /\s*(✓|✔|\*)$/.test(txt) || strong;

  }
  flush();
  return items;
}

function trText(t) {
  const lead = t.match(/^\s*/)[0], trail = t.match(/\s*$/)[0], core = t.trim();
  if (!core) return t;
  if (I18N[core]) return lead + I18N[core] + trail;
  for (const [rx, rep] of I18N_RX) { if (rx.test(core)) return lead + core.replace(rx, rep) + trail; }
  return t;
}
function translate(root) {
  if (LANG !== "en" || !root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
  for (let n = w.currentNode; n; n = w.nextNode()) {
    if (n.nodeType === 3) { const p = n.parentElement; if (!p || p.closest("textarea,script,style,[data-notr]")) continue; const v = trText(n.nodeValue); if (v !== n.nodeValue) n.nodeValue = v; }
    else for (const at of ["placeholder", "aria-label", "title"]) { const v = n.getAttribute && n.getAttribute(at); if (v) { const t = trText(v); if (t !== v) n.setAttribute(at, t); } }
  }
}
new MutationObserver(ms => { if (LANG !== "en") return; for (const m of ms) { if (m.type === "characterData") { const v = trText(m.target.nodeValue); if (v !== m.target.nodeValue) m.target.nodeValue = v; } else m.addedNodes.forEach(n => n.nodeType === 1 ? translate(n) : (n.nodeType === 3 && n.parentElement && !n.parentElement.closest("textarea,[data-notr]") && (n.nodeValue = trText(n.nodeValue)))); } })
  .observe(document.body, { subtree: true, childList: true, characterData: true });
